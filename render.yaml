services:
  - type: web
    name: ns-sm-brain-engine
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: METABASE_EMAIL
        value: ashritha.k@newtonschool.co
      - key: PYTHON_VERSION
        value: 3.11.0